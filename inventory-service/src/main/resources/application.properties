spring.application.name=inventory-service
server.port=8083

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:inventory_db}
spring.datasource.username=${DB_USER:inventory_user}
spring.datasource.password=${DB_PASSWORD:inventory_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=update es pragmatico para el desarrollo (sin Flyway/Liquibase).
# Documentar en el README que en un entorno real se usarian migraciones versionadas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
