spring.application.name=order-service
server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:order_db}
spring.datasource.username=${DB_USER:order_user}
spring.datasource.password=${DB_PASSWORD:order_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=update es pragmatico para el desarrollo (sin Flyway/Liquibase).
# Documentar en el README que en un entorno real se usarian migraciones versionadas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

inventory.service.base-url=http://localhost:8083
